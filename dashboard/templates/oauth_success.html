<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhishTrap – Connected</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style-new.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='animated-bg.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo Row -->
      <div class="logo-row">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="PhishTrap Logo" style="width: 56px; height: 56px; object-fit: contain;">
        <div>
          <h1>PhishTrap</h1>
          <p class="subtitle">AI Phishing Sandbox Console</p>
        </div>
      </div>

      <!-- Success Message -->
      <div style="text-align: center; margin: 2rem 0;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(52, 211, 153, 0.2) 100%); border: 2px solid rgba(16, 185, 129, 0.5); margin-bottom: 1.5rem;">
          <span style="font-size: 40px;">✅</span>
        </div>
        <h2 style="color: #10b981; font-size: 24px; font-weight: 600; margin-bottom: 1rem; background: linear-gradient(135deg, #10b981 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">AI Bot Connected!</h2>
        <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 0.5rem;">
          Successfully signed in with <strong style="color: var(--text-primary);">{{ provider }}</strong>
        </p>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 2rem;">
          Connected as <strong style="color: #10b981;">{{ email }}</strong>
        </p>
      </div>

      <!-- Info Box -->
      <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem;">
        <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin: 0;">
          🎯 Your email account is now connected to PhishTrap. The AI bot will automatically monitor incoming emails and engage with potential phishing attempts.
        </p>
      </div>

      <!-- Action Button -->
      <a href="{{ url_for('user_login') }}" class="primary-btn" style="width: 100%; text-align: center; text-decoration: none; display: block;">Back to Login</a>
    </div>
  </div>
</body>
</html>
