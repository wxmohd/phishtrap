<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhishTrap – Register</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="PhishTrap Logo" style="height: 80px;">
    </div>
    <h1>Create account</h1>
    <p class="muted">Local user registration</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash">
          {% for cat,msg in messages %}
            <div class="flash-item {{cat}}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" class="form">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Choose a strong password" required>

      <button type="submit" class="btn">Register</button>
    </form>

    <div class="footer-link">
      <a href="{{ url_for('login') }}">Back to sign-in</a>
    </div>
  </div>
</body>
</html>
